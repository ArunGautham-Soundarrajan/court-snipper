# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Court Snipper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 5" # Runs every Friday at 1:15 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser xvfb

      - name: Build
        run: go build -v -o court-snipper .

      - name: Create .env file
        run: |
          echo "USER_NAME=${{ secrets.USER_NAME }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "SIGN_IN_URL=${{ vars.SIGN_IN_URL }}" >> .env
          echo "CALENDAR_URL=${{ vars.CALENDAR_URL }}" >> .env
          echo "HEADLESS=${{ vars.HEADLESS }}" >> .env
          echo "TIME_SLOTS=${{ vars.TIME_SLOTS }}" >> .env

      - name: Run
        run: xvfb-run -a ./court-snipper
        env:
          DISPLAY: :99
